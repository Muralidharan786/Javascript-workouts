<div id="parent" style="border: 2px solid red; padding: 20px;">
    Parent
    <button id="child">Child</button>
</div>
<script>
    document.getElementById('parent').addEventListener('click', () =>{
        alert('Parent Clicked!');
    });
    document.getElementById('child').addEventListener('click', () =>{
        alert('Child Clicked!');
       
    });
</script>





<div id="parents" style="border: 2px solid blue; padding: 20px;">  
    Parent  
    <button id="childs">Child</button>
</div>
<script>
document.getElementById('parents').addEventListener(
    'click',
    () => {      
        alert('Parent clicked during capture!');
    },    
    { capture: true }   
);
document.getElementById('childs').addEventListener(
    'click',
    () => {
        alert('Child Clicked!');
    }
);
</script>






    <div id="parentst" style="border: 2px solid red; padding: 20px;">
    Parent
    <button id="childss">Child</button>
</div>
<script>
    document.getElementById('parentst').addEventListener('click', () =>{
        alert('Parent Clicked!');
    });
    document.getElementById('childss').addEventListener('click', () =>{
        alert('Child Clicked!');
        event.stopPropagation();  // Prevents the click event from bubbling up to the parentDiv
    });
    
</script>

<script>
    function greet(message, ...names) 
    {  
        document.write(message, "<br>"); 
        document.write(names);
