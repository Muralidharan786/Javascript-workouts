<script>

  if (event.target.tagName === "LI") {
    console.log("Clicked:", event.target.textContent);
    event.target.style.color = "red";
  }
});

  const li = document.createElement("li");
  li.textContent = "New Item";
  itemList.appendChild(li);
});

<script>
reserveRoom(hotelId, function () {  
    if (err) {    
        handleError();  
    } else {    
        processPayment(hotelId, function () {      
            if (err) {        
                handleError();      
            } else {        
                displayBookingStatus(hotelId, function () {          
                    if (err) {           
                        handleError();          
                    } else {            
                        recordBookingHistory(hotelId, function () {              
                            onSuccess();            
                    });          
                }        
            });      
        }    
    });  
}});

</script>

<script>
    function reserveRoom(hotelId, callback) {
    document.write("Reserving room:", hotelId, "<br/>");
    callback(); // simulate success
}

function processPayment(hotelId, callback) {
    document.write("Processing payment for:", hotelId, "<br/>");
    callback();
}

function displayBookingStatus(hotelId, callback) {
    document.write("Displaying booking status for:", hotelId, "<br/>");
    callback();
}

function recordBookingHistory(hotelId, callback) {
    document.write("Recording booking history for:", hotelId, "<br/>");
    callback();
}

function onSuccess() {
    document.write("Booking successful!");
}

function handleError() {
    document.write("An error occurred!");
}

let hotelId = 101;

// Now your nested callback code:
reserveRoom(hotelId, function () {
    // Note: still need to handle err properly if you want error handling
    processPayment(hotelId, function () {
        displayBookingStatus(hotelId, function () {
            recordBookingHistory(hotelId, function () {
                onSuccess();
            });
        });
    });
});

</script>
<!-- promise -->
<script>
    const myPromise = new Promise((resolve, reject) => {  
        let success = true; // Simulate an operation  
        if (success) {    
            resolve("Operation succeeded!");  
            } else {    
                reject("Operation failed.");  
                }});
    // Using the promise
    myPromise  
    .then((result) => {    
        console.log(result); // "Operation succeeded!"  
        })  
    .catch((error) => {    
        console.error(error); // "Operation failed."  
        });
</script>
<!-- Fetch API -->
<h2>Fetch API Operation</h2>
<script>
    fetch("https://jsonplaceholder.typicode.com/posts/1")
        .then((response) => {
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            return response.json(); // Parse JSON from the response
        })
        .then((data) => console.log(data)) // Use the data
        .catch((error) => console.error("Fetch error:", error)); // Handle errors
</script>



<!-- Async/Await -->
 <h2>Fetching Data Using Async/Await</h2>
    <div id="dataContainer">Loading...</div>
     <script>
     async function fetchData() {
        try {
         let response = await fetch("https://jsonplaceholder.typicode.com/todos/1");
         let data = await response.json();
            document.getElementById("dataContainer").innerText = JSON.stringify(data, null, 2);
         } catch (error) {
            document.getElementById("dataContainer").innerText = "Error fetching data!";
             console.error("Error:", error);
         }
         }
        fetchData();
    </script>




    <script>
        async function fetchUserData(userId) {  
            try {

                 } catch (error) {
