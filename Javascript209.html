<!--For Loop Example-->
<script>
    let price = 0; // Initial Prize Money
const lost = "Incorrect Answer!!\n---Better Luck Next Time";
console.log(" !! WELCOME TO KBC !!");

for (let i = 1; i < 4; i++) {
    let ans = ""; // Reset answer for each question

    // Question set
    switch (i) {
        case 1:
            ans = prompt("What does not grow on a tree according to a popular Hindi saying?\n [a: Money, b: Flower, c: Leaves, d: Fruits] : ");
            if (ans === 'a') {
                price += 1000 * i; // Increment prize money only if the answer is correct
                console.log("Correct Answer! Your Prize Money is : ₹" + price);
            } else {
                console.log(lost);
                break; // Exit the loop if the answer is wrong
            }
            break;

        case 2:
            ans = prompt("Which city is known as the Pink City in India?\n [a: Bangalore, b: Mysore, c: Jaipur, d: Kochi] : ");
            if (ans === 'c') {
                price += 1000 * i;
                console.log("Correct Answer! Your Prize Money is : ₹" + price);
            } else {
                console.log(lost);
                break;
            }
            break;

        case 3:
            ans = prompt("How many states are there in India?\n [a: 28, b: 29, c: 31, d: 30] : ");
            if (ans === 'a') {
                price += 1000 * i;
                console.log("Correct Answer! Your Prize Money is : ₹" + price);
                console.log("---------Congratulations! You Won The KBC---------");
            } else {
                console.log(lost);
                break;
            }
            break;

        default:
            console.log("Something went wrong!");
            break;
    }

    if (ans !== 'a' && i === 1 || ans !== 'c' && i === 2 || ans !== 'a' && i === 3) {
        break; // Stop execution if the answer is wrong
    }
}
</script>

<!-- Time and Distance       -->
<script>
const walk = 3; //average walking speed 3km/h
const bike = 60;//average biking speed 60km/h
const car = 80;//average car speed 80km/h
var lat1 = 18.943889; //starting latitude
var lon1 = 72.835991; //starting longitude
var lat2 = 19.218330;//ending latitude
var lon2 = 72.978088;// ending longitude
function distance() {
// Convert degrees to radians because trigonometric functions(sin, cos) in javascript work in radians not degrees
var lat1Rad = lat1 * Math.PI / 180;
var lon1Rad = lon1 * Math.PI / 180;
var lat2Rad = lat2 * Math.PI / 180;
var lon2Rad = lon2 * Math.PI / 180;
// haversine formula to calculate (Computes the shortest distance btw two points on Earth's surface)
distance = Math.acos(Math.sin(lat1Rad) * Math.sin(lat2Rad) + Math.cos(lat1Rad) * 
Math.cos(lat2Rad) * Math.cos(lon2Rad - lon1Rad)) * 6371; //6371 is the Earth's radius in Kilometers
console.log(distance) 
console.log(distance.toFixed(2) + "KM"); //To format with 2 decimal points
}
distance();
var mode = prompt("select the mode: \n1.walk \n2.bike \n3.car")
if (mode == '1') {
time = distance / walk     //hours = distance/speed
}
else if (mode == '2') {
time = distance / bike
}
else if (mode == '3') {
time = distance / car
}
console.log(time)
if (time < 1) {
console.log("time:" + time.toFixed(2) + "Min") //If time < 1 you are labeling it as Min but time is in hours so it will be 0.5 means 0.5 hours  = 30 minutes
}
else {
console.log("time:" + time.toFixed(2) + "Hrs")
}
 </script>
