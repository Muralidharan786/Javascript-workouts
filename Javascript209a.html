    <script>
        const company = {  
            name: "TechCorp",  
            address: {    
                street: "123 Innovation Dr",    
                city: "San Francisco",    
                zip: "94107"  
            },  
            employees: [    
                { name: "Shubham", role: "Developer" },    
                { name: "Apeksha", role: "Manager" }  
            ]};
            console.log(company.name);   // "TechCorp" - Accessing a top-level property             
            console.log(company.address.city); // "San Francisco" - Accessing a nested property
            console.log(company.employees[0].name); // "Shubham" - Accessing a nested object's property inside an array
    </script>

            <script>

            </script>
            <button id="myButton" onclick="handleClick"> Click Me </button>
            <script>
                const button = document.getElementById("myButton");
                function handleClick() {    
                    alert("Button clicked!");   
                    button.removeEventListener("click", handleClick);
                }
                button.addEventListener("click", handleClick)
