<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fetching</title>
</head>
<body>
<!-- Promise method -->
<script>
const myPromise = new Promise((resolve, reject) => {  
    let success = true;   
    if (success) {    
        resolve("Operation succeeded!");  
} else {    
    reject("Operation failed.");
}
}); 
// Using the promise
myPromise  
    .then((result) => {    
    document.write(result); // "Operation succeeded!"  
    })  
    .catch((error) => {    
     document.write(error); // "Operation failed."  
    });
</script>






<!-- Fetch Method -->
<h2>Post from API:</h2>
<pre id="output"></pre>

<script>
  fetch("https://jsonplaceholder.typicode.com/posts/1")
    .then((response) => {
      if (!response.ok) {
        throw new Error("Network response was not ok");
      }
      return response.json(); // Parse JSON
    })
    .then((data) => {
      console.log(data); 
      document.getElementById("output").textContent = JSON.stringify(data, null, 2);
    })
    .catch((error) => console.error("Fetch error:", error));
</script>



<!-- Async/Await-->   
<h2>User Data:</h2>
  <pre id="outputs">Loading...</pre>

  <script>
    async function fetchUserData(userId) {
      try {
        const response = await fetch(`https://jsonplaceholder.typicode.com/users/${userId}`);
        const user = await response.json();
        console.log(user); // Logs user data
        // Show result in browser
        document.getElementById("outputs").textContent = JSON.stringify(user, null, 2);
      } catch (error) {
        console.error("Error fetching user data:", error);
        document.getElementById("outputs").textContent = "Error: " + error.message;
      }
    }
    // Call the function
    fetchUserData(1);
  </script>


</body>
</html>
